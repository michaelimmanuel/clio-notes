[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
capture = { path = "crates/capture" }
pipeline = { path = "crates/pipeline" }
providers = { path = "crates/providers" }
storage = { path = "crates/storage" }

[profile.dev.package."*"]
# Audio resampling, VAD and image hashing are too slow unoptimized.
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
