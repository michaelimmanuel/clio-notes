[package]
name = "providers"
description = "Provider traits (speech-to-text, vision, text) and their adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls"] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

[dev-dependencies]
mockito = "1.7.2"

