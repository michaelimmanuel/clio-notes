<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Clio Notes</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">C</span>
        <span class="brand-name">Clio Notes</span>
      </div>
      <span class="crumb">Settings</span>
    </header>

    <main class="page">
      <section class="intro">
        <h1>AI providers</h1>
        <p>
          Clio Notes runs on your own API keys. Each job below uses one provider
          profile. Keys are kept in Windows Credential Manager, never in files.
        </p>
      </section>

      <section>
        <h2>Jobs</h2>
        <div id="roles" class="card roles"></div>
      </section>

      <section>
        <div class="row-between">
          <h2>Profiles</h2>
          <button id="add-profile" class="btn primary" type="button">Add profile</button>
        </div>
        <div id="form-slot"></div>
        <div id="profiles" class="profiles"></div>
        <p id="settings-path" class="fineprint"></p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
